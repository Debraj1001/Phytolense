name: phytolens
description: PhytoLens - AI Plant Health Detection App
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.5
  firebase_storage: ^12.4.5

  # Supabase
  supabase_flutter: ^2.8.4

  # ML / AI
  tflite_flutter: ^0.12.1
  image: ^4.3.0
  groq: ^1.1.1
  fllama: ^0.0.1
  
  # Security
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # Camera & Media
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # Payments
  razorpay_flutter: ^1.4.5

  # Charts
  fl_chart: ^0.69.0

  # UI & Animation
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.1.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17


  # Utils
  intl: 0.20.2
  share_plus: ^12.0.2
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  connectivity_plus: ^6.1.4
  package_info_plus: ^8.3.0
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  http: ^1.2.2
  logger: ^2.5.0
  timeago: ^3.7.0
  confetti: ^0.8.0
  google_sign_in: ^6.2.1
  app_links: ^7.0.0
  flutter_dynamic_icon_plus: ^1.4.1
  flutter_markdown: ^0.7.7+1
  # serious_python: ^4.7.0
  onnxruntime: ^1.4.1
  dio: ^5.11.1

  # Voice (Text-to-Speech for offline remedy read-aloud)
  flutter_tts: ^4.2.0

  # Local Database (offline scan history)
  sqflite: ^2.4.2
  path: ^1.9.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/animations/
    - assets/models/
    - assets/data/
